name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      configure_outcome: ${{ steps.configure.outcome }}
      upload_outcome: ${{ steps.upload.outcome }}
      deployment_outcome: ${{ steps.deployment.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        id: upload
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        if: steps.configure.outcome == 'success' && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail when a Pages stage failed
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          echo "Configure: $CONFIGURE_OUTCOME"
          echo "Upload: $UPLOAD_OUTCOME"
          echo "Deploy: $DEPLOYMENT_OUTCOME"
          test "$CONFIGURE_OUTCOME" = "success"
          test "$UPLOAD_OUTCOME" = "success"
          test "$DEPLOYMENT_OUTCOME" = "success"

  report:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify published URL
        id: verify
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          code="not-run"
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$PAGE_URL" ]; then
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /tmp/pages.html -w "%{http_code}" "$PAGE_URL" || true)
              if [ "$code" = "200" ]; then
                break
              fi
              sleep 10
            done
          fi
          echo "http_code=$code" >> "$GITHUB_OUTPUT"

      - name: Update deployment status issue
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CONFIGURE_OUTCOME: ${{ needs.deploy.outputs.configure_outcome }}
          UPLOAD_OUTCOME: ${{ needs.deploy.outputs.upload_outcome }}
          DEPLOYMENT_OUTCOME: ${{ needs.deploy.outputs.deployment_outcome }}
          HTTP_CODE: ${{ steps.verify.outputs.http_code }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[Pages] Deployment Status';
            const pageUrl = process.env.PAGE_URL || 'not available';
            const result = process.env.DEPLOY_RESULT || 'unknown';
            const httpCode = process.env.HTTP_CODE || 'unknown';
            const body = [
              '<!-- pages-status -->',
              `- Deployment job: **${result}**`,
              `- Configure Pages: **${process.env.CONFIGURE_OUTCOME || 'not-run'}**`,
              `- Upload artifact: **${process.env.UPLOAD_OUTCOME || 'not-run'}**`,
              `- Deploy Pages: **${process.env.DEPLOYMENT_OUTCOME || 'not-run'}**`,
              `- HTTP check: **${httpCode}**`,
              `- URL: ${pageUrl}`,
              `- Commit: \`${process.env.DEPLOY_SHA}\``,
              `- Run: ${process.env.RUN_URL}`,
              `- Checked at: ${new Date().toISOString()}`
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
